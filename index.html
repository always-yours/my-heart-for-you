<script>
(function () {
  'use strict';

  /* =========================================================
     3D 粒子圣诞树 —— 由 ZekangLi-Zico/Christmas-Tree (Python+Pygame)
     逐行移植为 Web 版。几何生成参数、相机、投影公式保持一致。
     渲染改为 ImageData 逐像素加色，兼容微信 / QQ 内置浏览器。
     ========================================================= */

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d', { alpha: true });

  // ---------- 相机 / 场景常量（与原版一致） ----------
  var TREE_HEIGHT = 12.0;
  var CAM_DIST    = 13.0;
  var CAM_HEIGHT  = 6.0;
  var PITCH       = -0.25;
  var COS_P = Math.cos(PITCH);
  var SIN_P = Math.sin(PITCH);
  var TAU = Math.PI * 2;

  // ---------- 确定性随机（保证 resize 后形态稳定） ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(20261225);

  function gauss(mu, sigma) {
    var u = 0, v = 0;
    while (u === 0) u = rnd();
    while (v === 0) v = rnd();
    return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
  }

  // ---------- 粒子生成 ----------
  function genTree(n, out) {
    var loops = 9;
    var spiralN = Math.floor(n * 0.7);
    var i, u, h, y, baseR, bw, t, ang, r, x, z, mid, bg, bb, cg, cb;

    // 70% 螺旋灯带
    for (i = 0; i < spiralN; i++) {
      u = rnd();
      h = Math.pow(u, 1.6);
      y = TREE_HEIGHT * h + 0.2;

      baseR = Math.pow(1 - h, 1.1) * 3.2;
      bw = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
      baseR *= 1 + 0.65 * bw;

      t = u * loops * TAU;
      ang = t + (rnd() * 0.44 - 0.22);
      r = baseR * (0.85 + rnd() * 0.23);
      x = Math.cos(ang) * r;
      z = Math.sin(ang) * r;

      mid = 1 - Math.abs(h - 0.55) * 1.5;
      if (mid < 0.15) mid = 0.15;
      bg = 155 + (90 * mid | 0);
      bb = 185 + (70 * mid | 0);
      cg = Math.min(255, bg + (rnd() * 36 | 0) - 15);
      cb = Math.min(255, bb + (rnd() * 51 | 0) - 15);

      if (rnd() < 0.08) {           // 更亮的小灯
        cg = 255 - (rnd() * 36 | 0);
        cb = 230 + (rnd() * 26 | 0);
      }
      out.push(x, y, z, 255, cg, cb);
    }

    // 30% 随机填充，让轮廓毛茸茸
    var fillN = n - spiralN;
    for (i = 0; i < fillN; i++) {
      h = Math.pow(rnd(), 1.9);
      y = TREE_HEIGHT * h + 0.2 + (rnd() * 0.16 - 0.08);

      baseR = Math.pow(1 - h, 1.1) * 4.3;
      bw = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
      baseR *= 1 + 0.65 * bw;

      r = baseR * Math.sqrt(rnd());
      ang = rnd() * TAU;
      x = Math.cos(ang) * r + (rnd() * 0.16 - 0.08);
      z = Math.sin(ang) * r + (rnd() * 0.16 - 0.08);

      out.push(x, y, z, 255, 165 + (rnd() * 61 | 0), 190 + (rnd() * 61 | 0));
    }
  }

  function genGround(n, out) {
    var rings = [4.6, 6.0, 7.4, 8.8, 10.2, 11.4];
    for (var i = 0; i < n; i++) {
      var ring = rings[(rnd() * 6) | 0];
      var r = gauss(ring, 0.3);
      var th = rnd() * TAU;
      var c = rnd() < 0.15 ? 235 + (rnd() * 21 | 0) : 190 + (rnd() * 46 | 0);
      // 压到 0.66：让地面法阵退到背景，树的粉色轮廓才立得住
      c = (c * 0.66) | 0;
      out.push(Math.cos(th) * r, -0.25, Math.sin(th) * r, c, c, 255);
    }
  }

  function genStars(n, out) {
    for (var i = 0; i < n; i++) {
      var x = rnd() * 36 - 18;
      var z = rnd() * 36 - 18;
      var y = 3 + rnd() * 15;
      var base = 215 + (rnd() * 41 | 0);
      out.push(x, y, z, base, base, 255);
    }
  }

  function genHeart(n, out) {
    var scale = 0.9;
    var topY = TREE_HEIGHT + 0.05;
    var made = 0;
    var guard = 0;
    while (made < n && guard < n * 60) {
      guard++;
      var x = rnd() * 2.6 - 1.3;
      var y = rnd() * 2.8 - 1.4;
      var f = Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y;
      if (f <= 0) {
        var wx = x * scale * 0.8;
        var wy = topY + (y + 1) * scale * 0.5;
        var wz = rnd() * 0.18 - 0.09;   // 厚度收薄，正面才认得出心形
        var dist = Math.sqrt(x * x + y * y);
        var factor = Math.max(0.35, 1.15 - 0.5 * dist);
        var g = Math.max(120, Math.min(255, (130 * factor + 80) | 0));
        var b = Math.max(120, Math.min(255, (190 * factor + 70) | 0));
        out.push(wx, wy, wz, 255, g, b);
        made++;
      }
    }
  }

  function buildScene(total) {
    rnd = mulberry32(20261225);
    var arr = [];
    var nTree   = Math.round(total * 0.845);
    var nGround = Math.max(1400, Math.round(total * 0.095));
    var nStar   = Math.max(280, Math.round(total * 0.0213));
    var nHeart  = Math.max(900, Math.round(total * 0.038));
    genTree(nTree, arr);
    genGround(nGround, arr);
    genStars(nStar, arr);
    genHeart(nHeart, arr);
    return new Float32Array(arr);
  }

  // ---------- 画布尺寸 / 缓冲区 ----------
  var W = 0, H = 0, buf = null, img = null;
  var scaleRef = 600;
  var offsetY = 0;
  var portrait = false;
  var scene = null;
  var totalParticles = 20000;
  var qualityStep = 0;

  var isMobile = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent) ||
                 Math.min(screen.width, screen.height) < 700;

  function layout() {
    var cssW = window.innerWidth;
    var cssH = window.innerHeight;

    // 内部分辨率：直接按接近物理像素渲染。
    // 降级时只缩分辨率，粒子数不变（粒子是廉价的，putImageData 才是瓶颈），
    // 这样降级后画面只是变柔，不会突然变稀。
    var baseCap = isMobile ? 1600 : 2100;
    var cap = qualityStep === 0 ? baseCap
            : (qualityStep === 1 ? baseCap * 0.78 : baseCap * 0.60);
    var longSide = Math.max(cssW, cssH);
    // 按设备像素比超采样，但不超出 cap（避免低端机被 putImageData 拖死）
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var q = Math.min(dpr, cap / longSide);

    W = Math.max(160, Math.round(cssW * q));
    H = Math.max(160, Math.round(cssH * q));

    canvas.width = W;
    canvas.height = H;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    img = ctx.createImageData(W, H);
    buf = img.data;
    buildBrush(W / cssW);

    portrait = H > W * 1.12;

    // 场景缩放：竖屏以宽度为主，横屏以高度为主（贴近原版构图）
    scaleRef = portrait
      ? Math.min(H * 0.55, W * 0.95)
      : Math.min(H * 0.64, W * 0.88);

    // 竖屏整体上移一点，给底部标题留呼吸空间
    offsetY = portrait ? -H * 0.055 : 0;

    // 粒子数按「CSS 面积」算，不按设备像素——否则提高分辨率等于凭空多画几倍粒子，
    // 视觉密度没变化却把帧率拖死。密度和笔刷半径挂钩：笔刷变小就用更多粒子补回来
    // （多而小的点总写像素数反而比少而大的点更省）。
    var cssArea = cssW * cssH;
    var base = Math.round(cssArea * 0.086);
    totalParticles = Math.max(6000, Math.min(80000, base));
    scene = buildScene(totalParticles);

    initFlakes();
    initHearts();
    buildOverlay();
  }

  // ---------- 笔刷 ----------
  // 原版是 3px 柔光点。分辨率提高后不能简单把九点采样点拉开——
  // 采样点之间会漏出空隙，粒子会变成"虚线十字"的颗粒噪点。
  // 所以按当前缩放倍数生成一张实心圆形笔刷（半径随 q 增长，权重高斯衰减），
  // 让粒子在任何分辨率下都是"同一颗柔光圆点"。
  var brushOff = null;   // Int32Array：相对首字节的偏移
  var brushA   = null;   // Int32Array：0..256 的强度
  var brushR   = 1;      // 半径（设备像素）

  function buildBrush(q) {
    var r = Math.round(q * 1.5 - 0.5);
    if (r < 1) r = 1; else if (r > 4) r = 4;
    brushR = r;

    var off = [], w = [], inv = 1 / r;
    for (var dy = -r; dy <= r; dy++) {
      for (var dx = -r; dx <= r; dx++) {
        var d2 = dx * dx + dy * dy;
        if (d2 > r * r + r) continue;            // 圆形裁切
        var t = Math.sqrt(d2) * inv;
        // 实心核（t<0.35 满强度）+ 余弦软边 → 是"一颗柔光点"，不是一颗噪点
        var a;
        if (t <= 0.35) a = 1;
        else if (t >= 1) a = 0;
        else { var u = (t - 0.35) / 0.65; a = 1 - u * u * (3 - 2 * u); }
        if (a < 0.05) continue;
        // dy*W*4 + dx*4 —— W 在 layout 里已更新
        off.push(((dy * W + dx) << 2));
        var wv = (a * 256) | 0;
        w.push(wv > 256 ? 256 : wv);
      }
    }
    brushOff = new Int32Array(off);
    brushA   = new Int32Array(w);
  }

  // ---------- 前景 2D 大雪花 ----------
  var flakes = [];
  var rnd2 = mulberry32(778899);

  function initFlakes() {
    var base = Math.min(W, H);
    var n = 10;
    flakes = [];
    for (var i = 0; i < n; i++) {
      flakes.push({
        x: rnd2() * W,
        y: -rnd2() * H * 0.25 - base * 0.02,
        r: base * (0.011 + rnd2() * 0.010),
        v: base * (0.033 + rnd2() * 0.017)
      });
    }
  }

  var flakeSprite = null;
  function makeFlakeSprite() {
    var s = 64;
    var c = document.createElement('canvas');
    c.width = c.height = s;
    var g2 = c.getContext('2d');
    var grd = g2.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grd.addColorStop(0,    'rgba(255,255,255,1)');
    grd.addColorStop(0.16, 'rgba(255,255,255,0.88)');
    grd.addColorStop(0.38, 'rgba(255,255,255,0.34)');
    grd.addColorStop(0.68, 'rgba(255,255,255,0.10)');
    grd.addColorStop(1,    'rgba(255,255,255,0)');
    g2.fillStyle = grd;
    g2.fillRect(0, 0, s, s);
    return c;
  }

  function drawSnow(dt) {
    var base = Math.min(W, H);
    var edge = H * 0.70;
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.y += f.v * dt;
      if (f.y > H + base * 0.08) {
        f.x = rnd2() * W;
        f.y = -rnd2() * H * 0.12 - base * 0.02;
        f.r = base * (0.011 + rnd2() * 0.010);
        f.v = base * (0.033 + rnd2() * 0.017);
      }

      var a = f.y > edge ? 1 - (f.y - edge) / (H * 0.30) : 1;
      if (a <= 0) continue;
      if (a > 1) a = 1;

      var r = f.r * 1.6;
      ctx.globalAlpha = a;
      ctx.drawImage(flakeSprite, f.x - r, f.y - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- 飘浮爱心（沿用上一版成品的精灵与参数） ----------
  var HEART_COLORS = ['#8fc3ff', '#ff8fbe', '#b39dff', '#7fe4ff', '#ffc7dd'];
  var heartSprites = {};
  var hearts = [];
  var rnd3 = mulberry32(424242);

  function makeHeartSprite(color) {
    // 精灵按高分辨率制备：手机上心最大要画到 ~100 设备像素，
    // 72px 的图会被放大，边缘出现锯齿和竖直接缝。
    var S = 128;
    var c = document.createElement('canvas');
    c.width = c.height = S;
    var g = c.getContext('2d');
    g.translate(S / 2, S / 2);
    g.scale(S / 48, -S / 48);
    g.beginPath();
    for (var i = 0; i <= 64; i++) {
      var a = i / 64 * TAU;
      var px = 16 * Math.pow(Math.sin(a), 3);
      var py = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
    // 自带外发光 + 实心，保证叠加到黑底上是「发光」而不是「灰斑」
    g.shadowColor = color;
    g.shadowBlur = 16;
    g.fillStyle = color;
    g.fill();
    g.fill();
    return c;
  }

  function initHearts() {
    if (!heartSprites[HEART_COLORS[0]]) {
      for (var k = 0; k < HEART_COLORS.length; k++) {
        heartSprites[HEART_COLORS[k]] = makeHeartSprite(HEART_COLORS[k]);
      }
    }
    // 以 CSS 像素为基准换算到缓冲区，保证手感大小不随分辨率变化
    var sf = W / (window.innerWidth || W);
    var n = Math.max(10, Math.min(18, Math.floor(W * H / 26000)));
    hearts = [];
    for (var i = 0; i < n; i++) {
      var right = i % 2 === 1;
      hearts.push({
        side: right ? 1 : 0,
        x: right ? W * (0.66 + rnd3() * 0.32) : W * (0.02 + rnd3() * 0.30),
        y: rnd3() * H,
        s: (5 + rnd3() * 9) * sf,
        v: (16 + rnd3() * 34) * sf,
        drift: (rnd3() - 0.5) * 16 * sf,
        ph: rnd3() * TAU,
        a: 0.78 + rnd3() * 0.22,
        c: HEART_COLORS[(rnd3() * HEART_COLORS.length) | 0]
      });
    }
  }

  function drawHearts(dt, now) {
    var sf = W / (window.innerWidth || W);
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < hearts.length; i++) {
      var ht = hearts[i];
      ht.y -= ht.v * dt;
      ht.x += (ht.drift + Math.sin(now * 0.001 + ht.ph) * 13 * sf) * dt;

      var lo = ht.side ? W * 0.63 : -30 * sf;
      var hi = ht.side ? W * 1.02 : W * 0.37;
      if (ht.y < -30 * sf) {
        ht.y = H + 20 * sf;
        ht.x = lo + rnd3() * (hi - lo);
      }
      if (ht.x < lo - 30 * sf) ht.x = hi;
      if (ht.x > hi + 30 * sf) ht.x = lo;

      var al = ht.a * (0.6 + 0.4 * (0.5 + 0.5 * Math.sin(now * 0.0015 + ht.ph)));
      var d = ht.s * 3.6;
      ctx.globalAlpha = al;
      ctx.drawImage(heartSprites[ht.c], ht.x - d / 2, ht.y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- 标题文字（预渲染成一张图层，避免每帧走 shadowBlur） ----------
  var TITLE = 'Merry Christmas';
  var TITLE_FONT = '"GreatVibes","Monotype Corsiva","Segoe Script","Brush Script MT",cursive,sans-serif';
  var overlay = null, overlayY = 0;

  function buildOverlay() {
    var fs, tx, ty, align;
    if (portrait) {
      overlayY = Math.round(H * 0.70);
      fs = Math.min(W * 0.088, H * 0.042);
      tx = W * 0.5;
      ty = H * 0.875 - overlayY;
      align = 'center';
    } else {
      fs = Math.min(H * 0.058, W * 0.05);
      overlayY = Math.max(0, Math.round(H * 0.355 - fs * 1.5));
      tx = W * 0.028;
      ty = H * 0.355 - overlayY;
      align = 'left';
    }
    var oh = Math.max(2, Math.round(portrait ? H - overlayY : fs * 3));

    overlay = document.createElement('canvas');
    overlay.width = W;
    overlay.height = oh;
    var c = overlay.getContext('2d');

    // 竖屏：底部渐隐遮罩，压暗地面光晕，标题才读得清
    if (portrait) {
      var grad = c.createLinearGradient(0, 0, 0, oh);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(0.55, 'rgba(0,0,0,0.55)');
      grad.addColorStop(1, 'rgba(0,0,0,0.92)');
      c.fillStyle = grad;
      c.fillRect(0, 0, W, oh);
    }

    c.textBaseline = 'middle';
    c.textAlign = align;
    c.font = fs + 'px ' + TITLE_FONT;
    c.shadowColor = 'rgba(150,200,255,0.9)';
    c.shadowBlur = fs * 0.7;
    c.fillStyle = 'rgba(255,255,255,0.97)';
    c.fillText(TITLE, tx, ty);
    c.shadowBlur = fs * 0.22;
    c.fillText(TITLE, tx, ty);
  }

  // ---------- 交互 ----------
  var angle = 0.0;
  var spinVel = 0;          // 拖动惯性
  var AUTO = 0.27;          // rad/s（原版 0.0045/帧 @60fps）
  var dragging = false;
  var lastX = 0, lastT = 0;
  var pointerId = null;

  function onDown(e) {
    if (dragging) return;
    dragging = true;
    pointerId = e.pointerId;
    lastX = e.clientX;
    lastT = performance.now();
    spinVel = 0;
    hideHint();
  }
  function onMove(e) {
    if (!dragging || e.pointerId !== pointerId) return;
    var now = performance.now();
    var dx = e.clientX - lastX;
    var dtm = Math.max(8, now - lastT) / 1000;
    var d = dx * 0.0075;
    angle += d;
    spinVel = d / dtm;
    lastX = e.clientX;
    lastT = now;
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    pointerId = null;
    // 惯性限幅，避免甩飞
    if (spinVel > 6) spinVel = 6;
    if (spinVel < -6) spinVel = -6;
  }

  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', onDown, { passive: true });
    window.addEventListener('pointermove', onMove, { passive: true });
    window.addEventListener('pointerup', onUp, { passive: true });
    window.addEventListener('pointercancel', onUp, { passive: true });
  } else {
    canvas.addEventListener('touchstart', function (e) {
      onDown({ pointerId: 1, clientX: e.touches[0].clientX });
    }, { passive: true });
    window.addEventListener('touchmove', function (e) {
      onMove({ pointerId: 1, clientX: e.touches[0].clientX });
    }, { passive: true });
    window.addEventListener('touchend', onUp, { passive: true });
    canvas.addEventListener('mousedown', function (e) { onDown({ pointerId: 1, clientX: e.clientX }); });
    window.addEventListener('mousemove', function (e) { onMove({ pointerId: 1, clientX: e.clientX }); });
    window.addEventListener('mouseup', onUp);
  }

  // 双击全屏
  var lastTap = 0;
  function tryFullscreen() {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
    } else if (fn) {
      try { fn.call(el); } catch (err) { /* iOS Safari 不支持，静默忽略 */ }
    }
  }
  canvas.addEventListener('click', function () {
    var now = Date.now();
    if (now - lastTap < 320) { tryFullscreen(); lastTap = 0; }
    else { lastTap = now; }
  });

  // 屏蔽手势缩放 / 长按菜单 / 拖动回弹
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  var hint = document.getElementById('hint');
  var hintTimer = setTimeout(function () { hint.classList.add('show'); }, 1200);
  var hintHide = setTimeout(hideHint, 12000);
  function hideHint() {
    clearTimeout(hintTimer); clearTimeout(hintHide);
    hint.classList.remove('show');
  }

  // ---------- 背景音乐 ----------
  // 微信 / iOS 禁止自动播放，必须在用户手势里调 play()，所以首次轻触才开始。
  // 若 bgm.m4a 加载失败（网络受限传不上音频文件），自动退回 Web Audio 现场合成。
  var bgm = document.getElementById('bgm');
  var muteBtn = document.getElementById('mute-btn');
  var started = false;
  var userMuted = false;
  var synthOn = false;

  // Jingle Bells 主旋律（公有领域），八音盒音色；每项 = [频率, 拍数]
  var M_C = 523.25, M_D = 587.33, M_E = 659.25, M_F = 698.46, M_G = 783.99;
  var MELODY = [
    [M_E, 1], [M_E, 1], [M_E, 2],
    [M_E, 1], [M_E, 1], [M_E, 2],
    [M_E, 1], [M_G, 1], [M_C, 1], [M_D, 1],
    [M_E, 4],
    [M_F, 1], [M_F, 1], [M_F, 1], [M_F, 1],
    [M_F, 1], [M_E, 1], [M_E, 1], [M_E, 1],
    [M_E, 1], [M_D, 1], [M_D, 1], [M_E, 1],
    [M_D, 2], [M_G, 2],
    [0, 2]
  ];
  var BEAT = 0.40;
  var ac = null, synthMaster = null, nextNoteTime = 0, noteIdx = 0, synthTimer = null;

  function scheduleNote(freq, t, dur) {
    var g = ac.createGain();
    var o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
    var o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.01;
    var o3 = ac.createOscillator(); o3.type = 'sine'; o3.frequency.value = freq * 3.02;
    var g2 = ac.createGain(); g2.gain.value = 0.30;
    var g3 = ac.createGain(); g3.gain.value = 0.10;
    o1.connect(g); o2.connect(g2); g2.connect(g); o3.connect(g3); g3.connect(g);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.30, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 2.4);
    g.connect(synthMaster);
    var end = t + dur * 2.5;
    o1.start(t); o1.stop(end);
    o2.start(t); o2.stop(end);
    o3.start(t); o3.stop(end);
  }

  function synthTick() {
    if (!synthOn) return;
    var now = ac.currentTime;
    while (nextNoteTime < now + 0.7) {
      var n = MELODY[noteIdx % MELODY.length];
      if (n[0] > 0) scheduleNote(n[0], nextNoteTime, n[1] * BEAT);
      nextNoteTime += n[1] * BEAT;
      noteIdx++;
    }
  }

  function ensureAudioCtx() {
    if (ac) return true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      ac = new AC();
      synthMaster = ac.createGain();
      synthMaster.gain.value = 0.42;
      synthMaster.connect(ac.destination);
      if (ac.state === 'suspended') ac.resume();
      return true;
    } catch (e) { ac = null; return false; }
  }

  function startSynth() {
    if (synthOn) return;
    if (!ensureAudioCtx()) return;
    try { bgm.pause(); } catch (e) {}
    if (ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
    synthOn = true;
    noteIdx = 0;
    nextNoteTime = ac.currentTime + 0.15;
    synthTick();
    synthTimer = setInterval(synthTick, 120);
    muteBtn.classList.add('playing');
  }

  function tryPlay() {
    if (started || userMuted) return;
    started = true;
    muteBtn.classList.add('playing');
    hideHint();
    // 必须在手势回调里同步建好 AudioContext，否则之后创建的会被判定为自动播放而静音
    ensureAudioCtx();
    bgm.volume = 1.0;
    var p = null;
    try { p = bgm.play(); } catch (e) { p = null; }
    if (p && p.then) {
      p.then(function () {
        if (synthOn) { try { bgm.pause(); } catch (e) {} }
      }).catch(function () {
        if (!synthOn) startSynth();
      });
    }
    // 只在「确定加载不到」时才切合成，绝不打断正在缓冲的原曲
    setTimeout(function () {
      if (synthOn) return;
      if (bgm.error || bgm.networkState === 3) startSynth();
    }, 6000);
  }

  function firstGesture(e) {
    var t = e.target;
    if (t && t.closest && t.closest('#mute-btn')) return;   // 按钮自己处理
    tryPlay();
    document.removeEventListener('pointerdown', firstGesture, true);
    document.removeEventListener('touchstart', firstGesture, true);
    document.removeEventListener('click', firstGesture, true);
    document.removeEventListener('keydown', firstGesture, true);
  }
  document.addEventListener('pointerdown', firstGesture, true);
  document.addEventListener('touchstart', firstGesture, true);
  document.addEventListener('click', firstGesture, true);
  document.addEventListener('keydown', firstGesture, true);

  muteBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!started) { tryPlay(); return; }
    userMuted = !userMuted;
    if (userMuted) {
      if (synthOn && ac) ac.suspend();
      else bgm.pause();
      muteBtn.classList.remove('playing');
      muteBtn.classList.add('muted');
    } else {
      muteBtn.classList.remove('muted');
      if (synthOn && ac) { if (ac.state === 'suspended') ac.resume(); }
      else bgm.play();
      muteBtn.classList.add('playing');
    }
  });

  // 首屏渲染稳定后再预载，避免和粒子抢带宽
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!started) bgm.preload = 'auto';
    }, 2000);
  });

  // ---------- 主循环 ----------
  var last = 0;
  var fpsAcc = 0, fpsFrames = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;          // 切后台回来不跳帧

    // ---- 旋转 ----
    if (!dragging) {
      angle += AUTO * dt + spinVel * dt;
      spinVel *= Math.pow(0.0025, dt);   // 指数衰减
      if (Math.abs(spinVel) < 0.02) spinVel = 0;
    }

    var cosA = Math.cos(angle), sinA = Math.sin(angle);

    // ---- 清屏 ----
    buf.fill(0);

    var n = scene.length;
    var halfW = W * 0.5, halfH = H * 0.5;
    var S = scaleRef;
    var Wm = W - 1, Hm = H - 1;

    // 高分辨率下笔刷半径随缩放倍数增长，粒子的视觉大小保持不变
    var R = brushR;
    var edgeX = R + 1, edgeY = R + 1;
    var limX = Wm - R, limY = Hm - R;
    var bOff = brushOff, bA = brushA, bN = bA.length;

    for (var i = 0; i < n; i += 6) {
      var x = scene[i], y = scene[i + 1], z = scene[i + 2];

      var xz = x * cosA - z * sinA;
      var zz = x * sinA + z * cosA;

      var zp = y * SIN_P + zz * COS_P + CAM_DIST;
      if (zp <= 0.1) continue;

      var yp = y * COS_P - zz * SIN_P - CAM_HEIGHT;
      var f = S / zp;
      var sx = halfW + xz * f;
      var sy = halfH - yp * f + offsetY;

      if (sx < edgeX || sx >= limX || sy < edgeY || sy >= limY) continue;

      // 近亮远暗（原版无衰减，这里保留极轻微的层次）
      var k = 1.05 - zp * 0.008;
      if (k > 1) k = 1;
      else if (k < 0.72) k = 0.72;

      var cr = (scene[i + 3] * k) | 0;
      var cg = (scene[i + 4] * k) | 0;
      var cb = (scene[i + 5] * k) | 0;

      var ix = sx | 0, iy = sy | 0;
      var p = (iy * W + ix) << 2;

      // 实心圆笔刷 + 「取最大」混合：等价于原版覆盖绘制，叠加不会泛白，
      // 也用不着排序，远处的点不会盖掉近处的亮线。
      for (var t = 0; t < bN; t++) {
        var qp = p + bOff[t];
        var k2 = bA[t];
        var vr = (cr * k2) >> 8, vg = (cg * k2) >> 8, vb = (cb * k2) >> 8;
        if (vr > buf[qp]) buf[qp] = vr;
        if (vg > buf[qp + 1]) buf[qp + 1] = vg;
        if (vb > buf[qp + 2]) buf[qp + 2] = vb;
        buf[qp + 3] = 255;
      }
    }

    ctx.putImageData(img, 0, 0);
    drawSnow(dt);
    drawHearts(dt, now);
    if (overlay) ctx.drawImage(overlay, 0, overlayY);

    // ---- 自适应降级：先按高清起步，跑不动再逐级退，40 帧内就给结论 ----
    if (qualityStep < 2 && !dragging && !document.hidden) {
      // 切后台 / 卡顿尖峰会让单帧异常长，直接丢弃这一轮采样，别误判成低性能
      if (dt > 0.2) { fpsAcc = 0; fpsFrames = 0; }
      fpsAcc += dt; fpsFrames++;
      if (fpsFrames >= 40) {
        var fps = fpsFrames / fpsAcc;
        var step = fps < 30 ? 2 : (fps < 48 ? 1 : 0);
        if (step) {
          qualityStep = Math.min(2, qualityStep + step);
          layout();
        }
        fpsAcc = 0; fpsFrames = 0;
      }
    }
  }

  // ---------- 启动 ----------
  flakeSprite = makeFlakeSprite();
  layout();
  requestAnimationFrame(frame);

  // 内嵌字体是异步解码的，加载完成后重画标题层，避免用回退字体画死
  if (document.fonts && document.fonts.load) {
    document.fonts.load('40px GreatVibes').then(function () {
      buildOverlay();
    }).catch(function () {});
    if (document.fonts.ready) {
      document.fonts.ready.then(function () { buildOverlay(); }).catch(function () {});
    }
  }

  var resizeTimer = null;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 180);
  }

  window.addEventListener('orientationchange', function () {
    setTimeout(onResize, 320);
  });
  window.addEventListener('resize', onResize);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) last = 0;
  });
})();
</script>
</body>
</html>
